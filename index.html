<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> Cloud Saver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="extension-container">
    <div class="star star-1">✦</div>
    <div class="star star-2">✦</div>
    <div class="star star-3">✦</div>
    <div class="star star-4">✦</div>
    <div class="star star-5">✦</div>
    <div class="star star-6">✦</div>
    <div class="star star-7">✦</div>
    <div class="star star-8">✦</div>
    <div class="star star-9">✦</div>
    <div class="star star-10">✦</div>
    <div class="star star-11">✦</div>
    <div class="star star-12">✦</div>
    <div class="star star-13">✦</div>
    <div class="star star-14">✦</div>
    <div class="star star-15">✦</div>

    <h2 class="title">Treasure's note </h2>

    <input type="text" id="saveInput" placeholder="What do you want to save ?"  />

    <div class="button-group">
      <button id="btnSave" class="cloud-btn">Save</button>
      <button id="btnSaveTab" class="cloud-btn">Save URL</button>
      <button id="btnDelete" class="cloud-btn delete-btn">Delete</button>
    </div>

    <div class="saved-items-container">
      <h3>Saved Items </h3>
      <ul id="savedList">
      </ul>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
